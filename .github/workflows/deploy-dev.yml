name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # repository_dispatch lands on the default branch by default; force dev
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Deploy to Cloudflare Pages (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # head_commit.message can be multiline and contain shell-special chars;
          # pass it via env, then strip to first line at runtime.
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          msg=$(printf '%s' "$RAW_COMMIT_MSG" | head -n1)
          npx wrangler@4 pages deploy out \
            --project-name=virtualexperts-preview \
            --branch=dev \
            --commit-hash=${{ github.sha }} \
            --commit-message="$msg"
