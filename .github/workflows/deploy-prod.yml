name: Deploy prod

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild (Mon 22:00 UTC = Tue 6am PH) so future-dated posts go
    # live on prod. The run still waits for the production-environment
    # approval before deploying.
    - cron: "0 22 * * 1"
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `production` environment must be configured in repo settings with
    # required reviewers. The deploy step blocks here until a reviewer approves.
    environment:
      name: production
      url: https://virtualexperts.ph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Deploy to Cloudflare Pages (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # head_commit.message can be multiline and contain shell-special chars;
          # pass it via env, then strip to first line at runtime.
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          msg=$(printf '%s' "$RAW_COMMIT_MSG" | head -n1)
          npx wrangler@4 pages deploy out \
            --project-name=virtualexperts \
            --branch=main \
            --commit-hash=${{ github.sha }} \
            --commit-message="$msg"
