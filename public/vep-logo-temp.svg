  <desc id="desc">A circular black and gold logo with VEP initials and the words Virtual Experts Philippines.</desc>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c79b44"/>
      <stop offset="45%" stop-color="#f2d06e"/>
      <stop offset="100%" stop-color="#b3842f"/>
